name: Fork checks

# This workflow is only for forks, so they can get basic checks in without a CircleCI API key
on:
  push:

env:
  NODE_OPTIONS: '--max_old_space_size=4096'

permissions: {}

jobs:
  check:
    name: Core Type Checking
    if: github.repository_owner != 'storybookjs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: check
        run: yarn task --task check

  formatting:
    name: Core Formatting
    if: github.repository_owner != 'storybookjs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: oxfmt
        run: cd code && yarn fmt:check

  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: Core Unit Tests, ${{ matrix.os }}
    if: github.repository_owner != 'storybookjs'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: compile
        run: yarn task --task compile --start-from=compile

      - name: Install Playwright Dependencies
        run: cd code && yarn exec playwright install chromium --with-deps

      - name: test
        run: yarn test

  smoke:
    name: v1 Smoke Test (sample stories)
    if: github.repository_owner != 'storybookjs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `yarn start` regenerates the sandbox, which does its own `yarn install`.
      # CI's default immutable-lockfile enforcement rejects that, the same
      # reason generate-sandboxes.yml sets this.
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: Install smoke test dependencies
        run: cd tests/smoke && npm install

      - name: Install Playwright Dependencies
        run: cd tests/smoke && npx playwright install chromium --with-deps

      - name: Smoke test (Task 1.5)
        run: cd tests/smoke && npm test
